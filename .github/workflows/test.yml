name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go mod tidy is clean
        if: runner.os == 'Linux'
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      # The race detector needs cgo on Windows, so it runs on Linux only.
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on -count=1 ./...

      - name: go test
        if: runner.os != 'Linux'
        run: go test -shuffle=on -count=1 ./...

      - name: build (all platforms)
        if: runner.os == 'Linux'
        run: |
          for p in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/backupproof
          done

  # The installer checks release signatures with minisign or OpenSSL; this
  # tests that check against signatures made by real minisign.
  signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: signature check in install.sh
        run: sh scripts/test-signature.sh

  # Feeds random and damaged input to the code that reads storage, backup
  # file lists, proofs and evidence packs. The seed inputs also run in every
  # go test; this explores beyond them for a short while on each change.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz
        run: |
          set -e
          for t in FuzzOpenBlob:./internal/repo FuzzOpenStorage:./internal/repo \
                   FuzzSafeRelPath:./internal/snapshot FuzzCleanPath:./internal/snapshot \
                   FuzzVerifyBundle:./internal/proof FuzzParsePublicKey:./internal/proof \
                   FuzzVerifyPack:./internal/server; do
            go test -run '^$' -fuzz "^${t%%:*}\$" -fuzztime 45s "${t#*:}"
          done
      - name: keep what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
