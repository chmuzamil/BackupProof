name: release

# Publishes a GitHub Release with binaries for every platform, checksums and
# the install scripts, and pushes Docker images to GHCR. Runs only for
# version tags, so pull requests and branch pushes can never publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    # The signing key lives in this environment's secrets (see docs/SIGNING.md).
    environment: release
    permissions:
      contents: write
      id-token: write      # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: test
        run: go test -count=1 ./...

      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${p%/*}; arch=${p#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/chmuzamil/backupproof/internal/engine.Version=backupproof/${VERSION#v}" \
              -o "dist/backupproof-$os-$arch$ext" ./cmd/backupproof
          done
          # The browser verifier for backupproof.dev/verify/, and the Go
          # loader it needs, both covered by SHA256SUMS.
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION#v}" \
            -o dist/backupproof-verify.wasm ./cmd/verify-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/backupproof-wasm_exec.js
          cp scripts/install.sh scripts/install.ps1 dist/

      # Every Go module built into the program, read from the binary itself.
      # It is listed in SHA256SUMS, so the signature covers it too.
      - name: software bill of materials
        uses: anchore/sbom-action@v0
        with:
          file: dist/backupproof-linux-amd64
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: checksums
        run: (cd dist && sha256sum backupproof-* install.sh install.ps1 sbom.spdx.json > SHA256SUMS)

      # SHA256SUMS covers every binary and both installers, so its signature
      # covers them too. The result is checked against the published key.
      - name: sign checksums
        env:
          VERSION: ${{ github.ref_name }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if grep -q PLACEHOLDER scripts/minisign.pub; then
            echo "::error::scripts/minisign.pub is still the placeholder; see docs/SIGNING.md"; exit 1
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the release environment has no MINISIGN_SECRET_KEY secret; see docs/SIGNING.md"; exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/release.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m dist/SHA256SUMS -t "BackupProof $VERSION SHA256SUMS" >/dev/null
          rm -f "$key"
          minisign -Vm dist/SHA256SUMS -p scripts/minisign.pub
          cp scripts/minisign.pub dist/minisign.pub

      - name: release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v=${VERSION#v}
          awk -v h="## [$v]" '
            index($0, h) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          key=$(sed -n 2p scripts/minisign.pub)
          cat >> notes.md <<EOF

          ## Verify

          \`SHA256SUMS\` is signed with the BackupProof release key, and lists every file here:
          \`\`\`bash
          minisign -Vm SHA256SUMS -P $key
          sha256sum --ignore-missing -c SHA256SUMS
          \`\`\`
          The installer checks both itself. See [docs/SIGNING.md](https://github.com/chmuzamil/BackupProof/blob/main/docs/SIGNING.md).
          EOF
          cat >> notes.md <<'EOF'

          ## Install

          Linux / macOS:
          ```bash
          curl -fsSL https://github.com/chmuzamil/BackupProof/releases/latest/download/install.sh | sudo sh
          ```

          Windows (PowerShell as Administrator):
          ```powershell
          irm https://github.com/chmuzamil/BackupProof/releases/latest/download/install.ps1 | iex
          ```

          Docker:
          ```bash
          docker run -d --name backupproof -p 8420:8420 -v backupproof-data:/data ghcr.io/chmuzamil/backupproof:latest
          ```
          EOF

      # Shows which commit and workflow run built each file:
      # gh attestation verify FILE -R chmuzamil/BackupProof
      - name: build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/backupproof-*
            dist/install.sh
            dist/install.ps1
            dist/sbom.spdx.json
            dist/SHA256SUMS

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "BackupProof $VERSION" --notes-file notes.md --verify-tag

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The agent image installs Debian packages for each platform.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: server-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/chmuzamil/backupproof
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}

      - id: agent-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/chmuzamil/backupproof-agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
