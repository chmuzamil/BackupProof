name: compat-fixtures

# Makes proofs with each release's own command-line tool, on a runner renamed
# compat-fixtures so no real machine name ends up in them. Run it by hand after
# a release, then commit the artifact under internal/proof/testdata/compat/.
# See docs/COMPATIBILITY.md.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to build (a git tag pattern)"
        default: "v0.2.*"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generic host name
        run: sudo hostnamectl set-hostname compat-fixtures && hostname
      - name: make fixtures
        env:
          TAGS: ${{ inputs.tags }}
        run: sh scripts/compat-fixtures.sh "$TAGS" compat
      - uses: actions/upload-artifact@v4
        with:
          name: compat-fixtures
          path: compat
