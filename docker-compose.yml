# BackupProof dashboard. Usage:
#   curl -fsSLO https://raw.githubusercontent.com/chmuzamil/BackupProof/main/docker-compose.yml
#   docker compose up -d
#   docker compose logs backupproof | grep "setup code"
#
# For use over the internet, put it behind HTTPS (Caddy, Traefik, nginx) and
# set BP_PUBLIC_URL to the https:// address other servers will use.
services:
  backupproof:
    image: ghcr.io/chmuzamil/backupproof:latest
    # To build from a clone of the repository instead:
    # build: { context: ., target: server }
    restart: unless-stopped
    ports: ["8420:8420"]
    environment:
      BP_PUBLIC_URL: ""            # e.g. https://backup.example.com
    volumes:
      - backupproof-data:/data
      # Folders the built-in agent should be able to protect, read-only:
      # - /srv:/host/srv:ro
      # - /var/www:/host/var/www:ro
volumes:
  backupproof-data:
